services:
  - type: web
    name: learnsphere-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://learnsphere-ai.vercel.app
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////var/data/learnsphere_cse.db
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: learnsphere-data
      mountPath: /var/data
      sizeGB: 1
